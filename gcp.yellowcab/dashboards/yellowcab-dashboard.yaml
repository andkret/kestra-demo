id: gcp-ecommerce-dashboard
title: GCP Ecommerce Dashboard
description: Simple metrics for namespace gcp.ecommerce

timeWindow:
  default: P7D
  max: P30D

charts:
  # 1) Executions over the last week (TimeSeries)
  - id: executions_last_week
    type: io.kestra.plugin.core.dashboard.chart.TimeSeries
    chartOptions:
      displayName: Executions (last 7 days)
      description: Count of executions over time, grouped by state
      legend:
        enabled: true
      column: start_date
      colorByColumn: state
      width: 12
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        start_date:
          field: START_DATE
          displayName: Start date
        state:
          field: STATE
          displayName: State
        total:
          field: ID
          displayName: Executions
          agg: COUNT
          graphStyle: BARS
      where:
        - type: EQUAL_TO
          field: NAMESPACE
          value: "gcp.ecommerce"

  # 2) Next execution for the flows in your namespace (Table)
  - id: next_execution
    type: io.kestra.plugin.core.dashboard.chart.Table
    chartOptions:
      displayName: Next execution per flow
      description: Next scheduled run based on triggers
      width: 12
    data:
      type: io.kestra.plugin.core.dashboard.data.Triggers
      columns:
        flow:
          field: FLOW_ID
          displayName: Flow
        trigger:
          field: TRIGGER_ID
          displayName: Trigger
        next_execution:
          field: NEXT_EXECUTION_DATE
          displayName: Next execution
      where:
        - type: EQUAL_TO
          field: NAMESPACE
          value: "gcp.ecommerce"
        - type: IS_NOT_NULL
          field: NEXT_EXECUTION_DATE
      orderBy:
        - column: next_execution
          order: ASC

  # 3) Success rate KPI (KPI)
  - id: success_rate
    type: io.kestra.plugin.core.dashboard.chart.KPI
    chartOptions:
      displayName: Success rate (last 7 days)
      numberType: PERCENTAGE
      width: 3
    data:
      type: io.kestra.plugin.core.dashboard.data.ExecutionsKPI
      columns:
        field: ID
        agg: COUNT
      numerator:
        - type: IN
          field: STATE
          values:
            - SUCCESS
      where:
        - type: EQUAL_TO
          field: NAMESPACE
          value: "gcp.ecommerce"

  # 4) Success vs Failed/Error per Flow (Bar, Counts)
  - id: flow_failed_error_counts
    type: io.kestra.plugin.core.dashboard.chart.Bar
    chartOptions:
      displayName: Failed/Error per Flow
      description: Failed + error executions per flow (last 7 days)
      column: flow
      width: 9
      legend:
        enabled: false
    data:
      type: io.kestra.plugin.core.dashboard.data.Executions
      columns:
        flow:
          field: FLOW_ID
          displayName: Flow
        total:
          field: ID
          displayName: Failed/Error
          agg: COUNT
      where:
        - type: EQUAL_TO
          field: NAMESPACE
          value: "gcp.ecommerce"
        - type: IN
          field: STATE
          values:
            - FAILED
            - ERROR
